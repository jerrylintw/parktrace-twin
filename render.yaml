# Render Dashboard > New > Blueprint > select this repository.
services:
  - type: web
    name: parktrace-twin-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parktrace-twin-db
          property: connectionString

databases:
  - name: parktrace-twin-db
    plan: free
    region: singapore
